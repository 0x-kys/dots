# BACKGROUND
background {
    monitor =
    path = ~/Pictures/1.jpg
    blur_passes = 3
    blur_size = 3
    contrast = 1.0
    brightness = 0.5
    vibrancy = 0.0
    vibrancy_darkness = 0.0
    color = rgb(0, 0, 0) # Black background
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 256, 48
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.5 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(00000000)
    inner_color = rgb(0, 0, 0) # Black inner
    font_color = rgb(255, 0, 0) # Red text
    fail_color = rgb(200, 0, 0) # Darker red for fail
    check_color = rgb(255, 0, 0) # Red for check
    capslock_color = rgb(255, 0, 0) # Red for capslock
    fade_on_empty = false
    font_family = Iosevka Nerd Font
    placeholder_text = ... #text for input password
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
    shadow_color = rgb(255, 0, 0) # Red shadow
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgb(255, 0, 0) # Red text
    font_size = 14
    font_family = Iosevka Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
    shadow_color = rgb(255, 0, 0) # Red shadow
}

# USER
label {
    monitor =
    text = cmd[update:1000] echo "$USER@$(hostname)"
    color = rgb(255, 0, 0) # Red text
    font_size = 14
    font_family = Iosevka Nerd Font Bold Italic
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
    shadow_color = rgb(255, 0, 0) # Red shadow
}

# PICTURE
image {
    path = ~/Pictures/pfp.jpg
    size = 200
    position = 0, 75
    halign = center
    valign = center
    border_size = 3
    border_color = rgb(255, 0, 0) # Red border
    shadow_passes = 1
    shadow_size = 5
    shadow_boost = 0.5
    shadow_color = rgb(255, 0, 0) # Red shadow
}
