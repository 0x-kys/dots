############
### BASIC ###
############

monitor=,preferred,auto,auto

$terminal = wezterm
$fileManager = dolphin
$menu = wofi --show drun

env = "XCURSOR_SIZE,16"
env = "HYPRCURSOR_SIZE,16"
env = "XDG_CURRENT_DESKTOP,Hyprland"
env = "XDG_SESSION_TYPE,wayland"
env = "XDG_SESSION_DESKTOP,Hyprland"
env = "QT_QPA_PLATFORM,xcb"
env = "WLR_NO_HARDWARE_CURSORS,1"
env = "GDK_SCALE,1"

#################
### AUTOSTART ###
#################

# exec-once = waypaper --restore
# exec-once = waybar &
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once = fcitx5
exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = dms run
exec-once = vicinae server

#####################
### LOOK AND FEEL ###
#####################

# General
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(444444ff)
    col.inactive_border = rgba(444444aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# Decoration
decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Blur
    blur {
        enabled = true
        size = 6
        passes = 1
        vibrancy = 1
    }
}

# Minimal Animations
animations {
    enabled = false

    # Simple bezier curves for minimal, smooth animations
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    bezier = quick, 0.1, 0.1, 0.1, 1.0

    # Minimal animations
    animation = windows, 1, 3, smooth, slide
    animation = windowsIn, 1, 2, smooth, slide
    animation = windowsOut, 1, 2, quick, slide
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 2, smooth, slide
}

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# Layouts
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false
    vfr = true
}

############
### INPUT ###
############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = true
    }
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Essential binds
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus controls
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Screenshot
bind = , Print, exec, XDG_CURRENT_DESKTOP=sway flameshot gui

# Mouse binds
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media controls
# bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
# bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Media player
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPause, exec, playerctl play-pause
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioPrev, exec, playerctl previous

### VICINAE BINDS ###

bind = $mainMod, Space, exec, vicinae toggle

### DMS BINDS ###

# using vicinae instead of dms spotlight
# bind = SUPER, Space, exec, dms ipc call spotlight toggle
bind = SUPER, V, exec, dms ipc call clipboard toggle
bind = SUPER, M, exec, dms ipc call processlist toggle
bind = SUPER, N, exec, dms ipc call notifications toggle
bind = SUPER, comma, exec, dms ipc call settings toggle
bind = SUPER, P, exec, dms ipc call notepad toggle
bind = SUPERALT, L, exec, dms ipc call lock lock
bind = SUPER, X, exec, dms ipc call powermenu toggle
bind = SUPER, C, exec, dms ipc call control-center toggle

bindl = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 5
bindl = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 5
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute

########################
### WINDOW RULES ###
########################

# Prevent maximize
windowrulev2 = suppressevent maximize, class:.*

# XWayland fix
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Floating rules for specified apps
windowrulev2 = float, class:^(org.kde.dolphin)$
windowrulev2 = float, class:^(waypaper)$
windowrulev2 = float, class:^(Android)$
windowrulev2 = float, class:^(android)$
windowrulev2 = float, class:^(com.android)$
windowrulev2 = float, class:^(Emulator)$
windowrulev2 = float, class:^(studio)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
# moves the window to x0, y0 on the screen
windowrulev2=move 0 0,class:(flameshot),title:(flameshot)
# shows the window on all workspaces
windowrulev2=pin,class:(flameshot),title:(flameshot)
# tell the application it's in fullscreen mode
windowrulev2=fullscreenstate,class:(flameshot),title:(flameshot)
# force the window to be floating ( not in a tiled pane )
windowrulev2=float,class:(flameshot),title:(flameshot)

########################
### LAYER RULES ###
########################

# blur
layerrule = blur,vicinae
layerrule = ignorealpha 0, vicinae

# disable fade animation for vicinae only
layerrule = noanim, vicinae
