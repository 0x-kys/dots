# Set prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable true color support for moonfly colorscheme
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable vim motions
set -g mode-keys vi
setw -g mode-keys vi

# Clipboard integration with osc52
# Requires: https://github.com/ojroques/vim-oscyank for full OSC52 support in vim
set -g set-clipboard on
set -s copy-command 'osc52'

# Mouse support for scrolling, selecting, resizing
set -g mouse on

# Vim-like pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window (tab) management
bind t new-window -c "#{pane_current_path}"
bind T command-prompt -I "#W" "rename-window '%%'"
bind n next-window
bind p previous-window
bind -r "<" swap-window -t -1 \; select-window -t -1
bind -r ">" swap-window -t +1 \; select-window -t +1

# Copy mode bindings (vim-like)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "osc52"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "osc52"
bind P paste-buffer

# Session resurrection with tmux-resurrect and continuum
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Additional plugins for enhanced functionality
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Status bar with moonfly-inspired colors
set -g status-style "fg=#80a0ff,bg=#1c2526"
set -g status-left "#[fg=#80a0ff,bg=#1c2526] #S #{prefix_highlight} "
set -g status-right "#[fg=#80a0ff,bg=#1c2526] #{pane_current_path} | %Y-%m-%d %H:%M "
set -g window-status-current-style "fg=#80a0ff,bold"
set -g window-status-format "#I:#W#{?window_zoomed_flag,🔍,}"
set -g window-status-current-format "#I:#W#{?window_zoomed_flag,🔍,}"
set -g pane-border-style "fg=#445566"
set -g pane-active-border-style "fg=#80a0ff"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Prevent automatic window renaming
set -g allow-rename off

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Zoom pane
bind z resize-pane -Z

# Quick pane sync
bind s set-window-option synchronize-panes \; display "Pane sync #{?synchronize-panes,ON,OFF}"

# Quick session switcher
bind S choose-tree -Zs

# Smart pane switching with awareness of vim splits
# Requires: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Quick copy mode
bind v copy-mode

# Kill pane/window/session
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind X confirm-before -p "Kill window? (y/n)" kill-window
bind Q confirm-before -p "Kill session? (y/n)" kill-session

# Search in copy mode
bind / copy-mode \; send-keys ?

# Open URLs/files in copy mode
bind o run-shell "tmux-open"

# Initialize TMUX plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
