# Prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Vim motions
set -g mode-keys vi
setw -g mode-keys vi

# Clipboard (requires: https://github.com/ojroques/vim-oscyank)
set -g set-clipboard on
set -s copy-command 'osc52'

# Mouse
set -g mouse on

# Keybinds: Pane management
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind x kill-pane
bind X kill-window
unbind '"'
unbind %

# Keybinds: Window management
bind t new-window -c "#{pane_current_path}"
bind T command-prompt -I "#W" "rename-window '%%'"
bind n next-window
bind p previous-window
bind -r "<" swap-window -t -1 \; select-window -t -1
bind -r ">" swap-window -t +1 \; select-window -t +1
bind W kill-window

# Keybinds: Copy mode
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "osc52"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "osc52"
bind P paste-buffer
bind / copy-mode \; send-keys ?

# Keybinds: Session management
bind S choose-tree -Zs
bind Q kill-session

# Keybinds: Miscellaneous
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind z resize-pane -Z
bind s set-window-option synchronize-panes \; display "Pane sync #{?synchronize-panes,ON,OFF}"
bind o run-shell "tmux-open"

# Smart pane switching (requires: https://github.com/christoomey/vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Status bar (Catppuccin Mocha)
set -g status-position top
set -g status-justify left
set -g status-style fg=#cdd6f4,bg=#11111b99
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bg=#11111b99] #S "
set -g status-right "#[fg=#89b4fa,bg=#11111b99]%a %d %b %Y %H:%M"
set -g window-status-format "#[fg=#cdd6f4,bg=#11111b99]#I:#W"
set -g window-status-current-format "#[fg=#1e1e2e,bg=#f5c2e7,bold] #I:#W "
set -g status-interval 1

# Window and pane indexing
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
